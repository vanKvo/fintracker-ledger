services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintracker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ledger:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fintracker
      DB_USERNAME: postgres
      DB_PASSWORD: mysecretpassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: